server {
    listen 80;
    server_name _;

    # NAS 업로드/다운로드용. 필요하면 키우면 됨
    client_max_body_size 8g;

    # Docker 내장 DNS. proxy_pass 에 변수를 쓰면 nginx 가 매번 다시 이름을 푼다.
    # (고정 문자열이면 기동 시 한 번만 풀어서, api 컨테이너를 재생성해 IP 가 바뀌면
    #  nginx 를 재시작할 때까지 502 가 난다 — make restart 시 실제로 발생)
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 스트리밍(채팅 · 인덱싱 진행률): 버퍼링·캐시 끄고 타임아웃 넉넉하게
    location ~ ^/api/(chat|rag/events) {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 대용량 파일 다운로드 시 디스크 버퍼링 방지
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }
}
